name: Holidays

# 内閣府の祝日 CSV を取得して holidays/ に置き、変換した JSON を GitHub Pages（gh-pages の holidays.json）に載せる。
# 翌年の祝日は毎年 2 月に掲載されるので、3 月 1 日に動かす（9:00 JST）。手で動かすこともできる。
on:
  schedule:
    - cron: "0 0 1 3 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holidays

jobs:
  update:
    name: Update holidays
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/setup

      - name: Fetch the CSV
        run: make holidays-update

      - name: Commit to main
        run: |
          git add holidays
          if git diff --cached --quiet; then
            echo "祝日データに変わりはありません"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(holidays): 祝日データを更新する"
          git push origin HEAD:main

      - name: Publish to GitHub Pages
        run: |
          git fetch --depth 1 origin gh-pages
          git worktree add ../pages FETCH_HEAD
          cp holidays/holidays.json ../pages/holidays.json
          cd ../pages
          git add holidays.json
          if git diff --cached --quiet; then
            echo "公開中の holidays.json に変わりはありません"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "祝日データを更新する"
          git push origin HEAD:gh-pages
